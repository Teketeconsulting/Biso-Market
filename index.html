<style>
:root{
  --green-d:#0E5A28; --green:#1D8A33; --green-l:#E3F2E5; --orange:#EE7410; --orange-d:#B85500;
  --bg:#F4F7F2; --surface:#FFFFFF; --ink:#142319; --muted:#566659; --line:#DAE4DC; --chip:#E8EFE9;
  --danger:#B3261E; --danger-bg:#FBE7E5; --warn-bg:#FFF1DD; --ok-bg:#E3F2E5; --info-bg:#E7F0FB; --info-ink:#134A8E;
  --on-green:#FFFFFF;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --green-d:#7BD08F; --green:#37A653; --green-l:#17301F; --orange:#F58A2E; --orange-d:#F5A25A;
    --bg:#0F1812; --surface:#17241B; --ink:#E7F0E9; --muted:#9AAE9F; --line:#273A2D; --chip:#1F3025;
    --danger:#FF8A80; --danger-bg:#3A1B19; --warn-bg:#3A2A12; --ok-bg:#17301F; --info-bg:#162A44; --info-ink:#9CC4F5;
    --on-green:#08130B; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);min-height:100dvh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--green)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
#app{min-height:100dvh}

/* Accueil */
.welcome{min-height:100dvh;display:flex;flex-direction:column;background:#0E5A28;color:#fff}
.w-hero{position:relative;flex:0 0 auto}
.w-hero img{display:block;width:100%;max-width:640px;margin:0 auto;height:auto}
.w-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(to bottom,rgba(14,90,40,0),#17803A 90%,#17803A)}
.w-bottom{flex:1;margin-top:-26px;position:relative;z-index:2;padding:0 20px max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:center;background:linear-gradient(to bottom,#17803A,#0E5A28)}
.w-bottom .btn{max-width:420px}
.tag{font-style:italic;font-weight:600;text-align:center;margin-top:6px;text-wrap:balance}
.flag{height:12px;width:calc(100% + 40px);margin:auto -20px 0;background:linear-gradient(100deg,transparent 0 50%,#1F6FD1 50% 66%,#F7D117 66% 74%,#CE1126 74% 84%,#F7D117 84% 90%,#1F6FD1 90%)}
.w-link{background:none;border:0;color:#fff;text-decoration:underline;padding:8px;font-size:.95rem}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:999px;border:2px solid var(--green);background:var(--green);color:var(--on-green);font-weight:700;padding:12px 20px;text-decoration:none}
.btn.light{background:#fff;color:#0E5A28;border-color:#fff}
.btn.sec{background:transparent;color:var(--green);border-color:var(--green)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;padding:6px 14px;width:auto;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* Barres */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.top .em{width:38px;height:38px;border-radius:8px;object-fit:cover}
.wm{font-weight:800;letter-spacing:.2px;font-size:1.05rem;color:var(--green-d)}
.wm i{font-style:normal;color:var(--orange)}
.top .sp{flex:1}
.back{background:none;border:0;font-size:1.6rem;line-height:1;padding:4px 10px 4px 0;color:var(--green-d)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);min-height:54px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--green-d);font-weight:700}
main.pg{padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}

/* Formulaires */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-weight:600;font-size:.9rem}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:44px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--green)}
.hint{font-size:.82rem;color:var(--muted)}
.err{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:.92rem}
.note{border-radius:10px;padding:10px 12px;font-size:.92rem}
.note.info{background:var(--info-bg);color:var(--info-ink)}
.note.warn{background:var(--warn-bg)}
.note.ok{background:var(--ok-bg)}
.pw{position:relative}
.pw button{position:absolute;right:4px;top:4px;min-height:40px;border:0;background:none;color:var(--green-d);font-weight:600;padding:0 10px}

/* Catalogue */
.search{position:sticky;top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;padding:8px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vb{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;font-size:.72rem;padding:2px 6px}
.pb{padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pn{font-weight:700;overflow-wrap:anywhere}
.pp{color:var(--orange-d);font-weight:800}
.ps{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--chip);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--green-d)}
.badge.wait{background:var(--warn-bg);color:var(--orange-d)}
.badge.bad{background:var(--danger-bg);color:var(--danger)}

/* Listes fournisseur / admin */
.item{display:flex;gap:12px;align-items:flex-start}
.item .ph{width:84px;flex:none;aspect-ratio:1;border-radius:10px;overflow:hidden;font-size:.68rem}
.item .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.media-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mt{position:relative;flex:none;width:96px;display:flex;flex-direction:column;gap:4px;font-size:.72rem}
.mt .ph{aspect-ratio:1;border-radius:8px;overflow:hidden;padding:0}
.mt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* Feuille (fenêtre du bas) */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{background:var(--chip);border:0;border-radius:50%;width:40px;height:40px;font-size:1.2rem;flex:none}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px}
.gal>*{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;background:var(--chip);border-radius:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#14301D;color:#fff;padding:12px 16px;border-radius:12px;max-width:520px;font-size:.92rem;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#toast div.bad{background:#8E1C15}
.spin{display:flex;justify-content:center;padding:30px}
.spin i{width:30px;height:30px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--green);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin i{animation-duration:3s}}
.empty{text-align:center;color:var(--muted);padding:26px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.kvl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.kvl:last-child{border:0}
.zr{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.zr:last-child{border:0}
.zr .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){ var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function normPhone(s){
  var d = String(s || '').replace(/\D/g, '');
  if (d.indexOf('00243') === 0) d = d.slice(2);
  if (d.indexOf('243') === 0) { /* ok */ }
  else if (d.charAt(0) === '0') d = '243' + d.slice(1);
  else if (d.length === 9) d = '243' + d;
  return /^243\d{9}$/.test(d) ? d : null;
}

function ApiError(m, status, code){ this.message = m; this.status = status || 0; this.code = code || ''; }
ApiError.prototype = Object.create(Error.prototype);
function apiMsg(m, c){
  var x = String(m).toLowerCase();
  if (x.indexOf('invalid login credentials') > -1) return 'Numéro ou mot de passe incorrect.';
  if (x.indexOf('already registered') > -1 || x.indexOf('already been registered') > -1 || c === 'user_already_exists') return 'Ce numéro a déjà un compte. Connectez-vous.';
  if (x.indexOf('at least') > -1 && x.indexOf('character') > -1) return 'Le mot de passe doit avoir au moins 6 caractères.';
  if (x.indexOf('rate limit') > -1 || c === 'over_request_rate_limit' || c === 'over_email_send_rate_limit') return 'Trop de tentatives. Réessayez dans quelques minutes.';
  if (x.indexOf('email not confirmed') > -1) return "La confirmation par e-mail est encore activée dans Supabase. Il faut la désactiver (Authentication, Sign In / Providers, Email).";
  if (x.indexOf('valid email') > -1 || x.indexOf('invalid format') > -1 || c === 'email_address_invalid') return "Ce numéro est refusé par le service d'identification.";
  if (x.indexOf('jwt expired') > -1) return 'Votre session a expiré. Reconnectez-vous.';
  if (x.indexOf('bucket not found') > -1) return "Le stockage des photos n'est pas prêt.";
  if (x.indexOf('mime type') > -1 || x.indexOf('not supported') > -1) return "Ce type de fichier n'est pas accepté.";
  if (x.indexOf('exceeded the maximum') > -1 || x.indexOf('too large') > -1) return 'Fichier trop lourd.';
  if (c === '42501' || x.indexOf('row-level security') > -1 || x.indexOf('permission denied') > -1) return "Action refusée. Votre compte n'a pas encore ce droit.";
  if (c === '23505') return 'Cet élément existe déjà.';
  return m;
}
function rawFetch(url, opts){
  return fetch(url, opts).catch(function(){
    throw new ApiError('Pas de connexion. Vérifiez internet et réessayez.', 0);
  }).then(function(res){
    return res.text().then(function(txt){
      var data = null;
      if (txt){ try { data = JSON.parse(txt); } catch(e){ data = txt; } }
      if (!res.ok){
        var m = (data && (data.msg || data.message || data.error_description || data.error)) || ('Erreur ' + res.status);
        var c = (data && (data.error_code || data.code)) || '';
        throw new ApiError(apiMsg(m, String(c)), res.status, String(c));
      }
      return data;
    });
  });
}
function authFetch(path, body){
  return rawFetch(SUPABASE_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

function signOut(msg){
  S.session = null; S.profile = null; S.fourn = null; S.adminLevel = null; S.mesProduits = null; S.mesDemandes = null;
  S.adm.fourn = null; S.adm.prod = null; S.adm.zVilles = null; S.sheet = null; S.pf = null; S.draft = {}; S.tab = null; S.screen = 'welcome'; S.error = msg || '';

var refreshing = null;
function refreshSession(){
  if (refreshing) return refreshing;
  if (!S.session || !S.session.refresh_token) return Promise.reject(new ApiError('Session expirée.', 401));
  refreshing = authFetch('token?grant_type=refresh_token', { refresh_token: S.session.refresh_token })
    .then(function(d){ setSession(d); })
    .catch(function(e){ if (e.status === 0) throw e; signOut('Votre session a expiré. Reconnectez-vous.'); throw new ApiError('Session expirée.', 401); })
    .then(function(){ refreshing = null; }, function(e){ refreshing = null; throw e; });

function ensureToken(){
  if (!S.session) return Promise.resolve(null);
  if (S.session.expires_at - 60 < Date.now() / 1000) return refreshSession().then(function(){ return S.session.access_token; });

}

    if (token) h.Authorization = 'Bearer ' + token;
    if (o.prefer) h.Prefer = o.prefer;
    return rawFetch(SUPABASE_URL + '/rest/v1/' + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined });
  }).catch(function(e){
    if (e.status === 401 && retry !== false && S.session) return refreshSession().then(function(){ return rest(path, o, false); });

function remove(path){
  return rest(path, { method: 'DELETE', prefer: 'return=representation' }).then(function(r){
    if (!r || !r.length) throw new ApiError("Action refusée. Votre compte n'a pas ce droit.", 403);
    return r;
  });
}
function storageUpload(bucket, path, blob, type){
  return ensureToken().then(function(token){
    return rawFetch(SUPABASE_URL + '/storage/v1/object/' + bucket + '/' + path.split('/').map(encodeURIComponent).join('/'), {
      method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + token, 'Content-Type': type, 'x-upsert': 'false' }, body: blob
    });
  });
}
function storageRemove(bucket, paths){
  return ensureToken().then(function(token){
    return rawFetch(SUPABASE_URL + '/storage/v1/object/' + bucket, {
      method: 'DELETE', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: paths })
    });
  });
}

/* ---------- Photos et vidéos ---------- */
function compressImage(file, maxDim){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var sc = Math.min(1, maxDim / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new ApiError("Cette photo n'a pas pu être lue.")); }, 'image/jpeg', 0.8);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new ApiError("Cette photo n'a pas pu être lue.")); };
    img.src = url;
  });
}
function checkVideo(file){
  return new Promise(function(res, rej){
    if (!/^video\/(mp4|webm|quicktime)$/.test(file.type)) return rej(new ApiError('Format vidéo non accepté (MP4, MOV ou WebM).'));
    if (file.size > MAX_VIDEO_MB * 1048576) return rej(new ApiError('Vidéo trop lourde : ' + MAX_VIDEO_MB + ' Mo au maximum. Filmez en qualité plus basse ou plus court.'));
    var url = URL.createObjectURL(file), v = document.createElement('video'), done = false;
    function fin(err){ if (done) return; done = true; URL.revokeObjectURL(url); err ? rej(err) : res(file); }
    v.preload = 'metadata';
    v.onloadedmetadata = function(){ (v.duration && v.duration > MAX_VIDEO_S + 1) ? fin(new ApiError('Vidéo trop longue : ' + MAX_VIDEO_S + ' secondes au maximum.')) : fin(); };
    v.onerror = function(){ fin(); };
    setTimeout(function(){ fin(); }, 4000);
    v.src = url;
  });
}
function extOf(type){ return type === 'video/webm' ? 'webm' : type === 'video/quicktime' ? 'mov' : 'mp4'; }

/* ---------- Données de référence ---------- */
function ensureProvinces(){
  if (S.geo.provinces) return Promise.resolve(S.geo.provinces);
  return rest('provinces?select=*&order=nom').then(function(r){ S.geo.provinces = r || []; return S.geo.provinces; });
}
function ensureVilles(pid){
  if (!pid) return Promise.resolve([]);
  if (S.geo.villes[pid]) return Promise.resolve(S.geo.villes[pid]);
  return rest('villes?select=*&province_id=eq.' + pid + '&order=nom').then(function(r){ S.geo.villes[pid] = r || []; return S.geo.villes[pid]; });
}
function ensureCommunes(vid){
  if (!vid) return Promise.resolve([]);
  if (S.geo.communes[vid]) return Promise.resolve(S.geo.communes[vid]);
  return rest('communes?select=*&ville_id=eq.' + vid + '&order=nom').then(function(r){ S.geo.communes[vid] = r || []; return S.geo.communes[vid]; });
}
function ensureCats(){
  if (S.cats) return Promise.resolve(S.cats);
  return rest('categories?select=*&order=ordre,nom').then(function(r){ S.cats = r || []; return S.cats; });
}
function ensureUnites(){
  if (S.unites) return Promise.resolve(S.unites);
  return rest('unites?select=*&order=libelle').then(function(r){ S.unites = r || []; return S.unites; });
}
/* Pré-remplit Kinshasa (ville pilote) dans un jeu de champs géographiques. */
function geoDefaults(p){
  var d = S.draft;
  if (d[p + 'prov']) return ensureVilles(d[p + 'prov']).then(function(v){ return d[p + 'ville'] ? ensureCommunes(d[p + 'ville']) : null; });
  return ensureProvinces().then(function(list){
    var k = list.filter(function(x){ return x.nom === 'Kinshasa'; })[0];
    if (!k) return null;
    d[p + 'prov'] = String(k.id);
    return ensureVilles(k.id).then(function(v){
      if (v.length === 1){ d[p + 'ville'] = String(v[0].id); return ensureCommunes(v[0].id); }
    });
  });
}
function geoHtml(p, withCommune){
  var d = S.draft, provs = S.geo.provinces || [], vs = d[p + 'prov'] ? (S.geo.villes[d[p + 'prov']] || []) : [], cs = d[p + 'ville'] ? (S.geo.communes[d[p + 'ville']] || []) : [];
  function opts(list, cur, ph){ return '<option value="">' + ph + '</option>' + list.map(function(x){ return '<option value="' + x.id + '"' + (String(cur) === String(x.id) ? ' selected' : '') + '>' + esc(x.nom) + '</option>'; }).join(''); }
  var h = '<div class="field"><label for="' + p + 'prov">Province</label><select id="' + p + 'prov" data-geo="' + p + '|prov" data-k="' + p + 'prov">' + opts(provs, d[p + 'prov'], 'Choisir la province') + '</select></div>';
  h += '<div class="field"><label for="' + p + 'ville">Ville ou territoire</label><select id="' + p + 'ville" data-geo="' + p + '|ville" data-k="' + p + 'ville">' + opts(vs, d[p + 'ville'], d[p + 'prov'] ? 'Choisir la ville' : 'Choisissez d\'abord la province') + '</select></div>';
  if (withCommune && cs.length) h += '<div class="field"><label for="' + p + 'commune">Commune</label><select id="' + p + 'commune" data-k="' + p + 'commune">' + opts(cs, d[p + 'commune'], 'Choisir la commune') + '</select></div>';
  return h;
}
function fieldHtml(id, label, type, ph, extra){
  var v = S.draft[id] == null ? '' : S.draft[id];
  extra = extra || {};
  if (type === 'textarea') return '<div class="field"><label for="' + id + '">' + label + '</label><textarea id="' + id + '" data-k="' + id + '" placeholder="' + esc(ph || '') + '">' + esc(v) + '</textarea></div>';

var PSEL = 'produits?select=id,nom,description,origine,conservation,prix,devise,quantite_min,stock,disponible,categorie_id,fournisseur_id,statut,valide_par_admin,motif_refus,unite_id,unites(libelle),produit_medias(id,type,chemin,ordre,statut)';
function loadCatalogue(){
  var c = S.cat, q = 'produits?select=' + PSEL.split('select=')[1] + '&statut=eq.publie&order=created_at.desc&limit=80';
  var ids = [];
  if (c.subId) ids = [c.subId];
  else if (c.catId) ids = [c.catId].concat((S.cats || []).filter(function(x){ return x.parent_id === c.catId; }).map(function(x){ return x.id; }));
  if (ids.length) q += '&categorie_id=in.(' + ids.join(',') + ')';
  var words = c.q.trim().split(/\s+/).filter(Boolean).slice(0, 5).map(function(w){ return w.replace(/[(),*%]/g, ''); }).filter(Boolean);
  if (words.length) q += '&and=' + encodeURIComponent('(' + words.map(function(w){ return 'or(nom.ilike.*' + w + '*,description.ilike.*' + w + '*)'; }).join(',') + ')');
  c.items = null; refreshGrid();
  var mine = c.token = (c.token || 0) + 1;
  return Promise.all([rest(q), rest('fournisseurs_publics?select=user_id,nom_commerce')]).then(function(r){
    if (mine !== c.token) return;
    c.items = r[0] || [];
    (r[1] || []).forEach(function(f){ S.fpub[f.user_id] = f; });
    refreshGrid();
  }).catch(function(e){ if (mine === c.token){ c.items = []; refreshGrid(); toast(e.message, 'err'); } });
}

/* ---------- Rendu ---------- */
function shellFor(role){
  if (role === 'client') return { tabs: [['accueil', 'Accueil', 'home'], ['compte', 'Compte', 'user']], def: 'accueil' };
  if (role === 'fournisseur') return { tabs: [['produits', 'Produits', 'box'], ['profil', 'Boutique', 'user']], def: 'produits' };
  if (role === 'admin') return { tabs: [['fourn', 'Fournisseurs', 'users'], ['prod', 'Produits', 'box'], ['zones', 'Zones', 'map'], ['compte', 'Compte', 'shield']], def: 'fourn' };
  return { tabs: [['compte', 'Compte', 'user']], def: 'compte' };
}
function page(){
  var r = S.profile.role;
  if (r === 'client') return S.tab === 'compte' ? clientCompte() : clientAccueil();
  if (r === 'fournisseur'){
    if (!S.fourn) return S.tab === 'profil' ? fournProfil() : fournSetupView();
    return S.tab === 'profil' ? fournProfil() : produitsView();
  }
  if (r === 'admin') return S.tab === 'prod' ? admProd() : S.tab === 'zones' ? admZones() : S.tab === 'compte' ? compteView() : admFourn();
  return '<div class="note ok">Votre compte livreur est actif. L\'espace livreur (courses, statuts, caisse) arrive dans la prochaine étape. Vous serez prévenu dès qu\'une course vous sera attribuée.</div>' + compteView();
}
function sheetHtml(){
  if (!S.sheet) return '';
  var h = '';
  if (S.sheet === 'detail'){ var p = (S.cat.items || []).filter(function(x){ return x.id === S.sheetId; })[0]; h = p ? detailSheet(p) : ''; }
  else if (S.sheet === 'request') h = requestSheet();
  else if (S.sheet === 'product') h = productSheet();
  return '<div class="ov" data-act="ovclose"><div class="sheet" role="dialog" aria-modal="true">' + h + '</div></div>';
}
function render(){
  var app = document.getElementById('app'), html = '';
  document.body.classList.toggle('lock', !!S.sheet);
  if (!S.session){
    html = S.screen === 'login' ? loginView() : S.screen === 'signup' ? signupView() : S.screen === 'guest' ? guestView() : welcomeView();
  } else if (S.loading || !S.profile){
    html = topbar() + (S.error ? '<main class="wrap pg"><div class="err">' + esc(S.error) + '</div><button class="btn sec" data-act="logout">Se déconnecter</button></main>' : '<div class="spin"><i></i></div>');
  } else {
    var sh = shellFor(S.profile.role);
    if (!S.tab) S.tab = sh.def;
    html = topbar() + '<main class="wrap pg">' + page() + '</main>' + tabsBar(sh.tabs);
  }
  var sy = window.scrollY, active = document.activeElement && document.activeElement.id;
  app.innerHTML = html + sheetHtml();
  if (active && !S.sheet){ var el = document.getElementById(active); if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) { try { el.focus(); var n = el.value.length; if (el.setSelectionRange && el.type !== 'number' && el.type !== 'search') el.setSelectionRange(n, n); } catch(e){} } }
  window.scrollTo(0, sy);
}
function guestView(){
  return '<header class="top"><button class="back" data-act="go" data-v="welcome" aria-label="Retour">‹</button><img class="em" src="' + ICON + '" alt=""><div class="wm"><b>BISO</b> <i>MARKET</i></div><div class="sp"></div><button class="btn sm" data-act="go" data-v="login">Se connecter</button></header><main class="wrap pg">' + catalogueView() + '</main>';

/* ---------- Chargement après connexion ---------- */
function boot(){
  if (!S.session){ render(); return Promise.resolve(); }
  S.loading = true; S.error = ''; render();
  return rest('profiles?id=eq.' + uid() + '&select=*').then(function(rows){
    if (!rows || !rows[0]) throw new ApiError("Profil introuvable. Déconnectez-vous puis reconnectez-vous.", 404);
    S.profile = rows[0];
    if (!S.profile.actif) throw new ApiError('Ce compte est désactivé. Contactez le service client.', 403);
    return afterProfile();
  }).then(function(){ S.loading = false; render(); onTab(); }).catch(function(e){
    S.loading = false; S.error = e.message; S.profile = null; render();
  });
}
function afterProfile(){
  var r = S.profile.role;
  if (r === 'client') return Promise.all([ensureCats(), ensureProvinces()]).then(loadCatalogue).then(function(){});
  if (r === 'fournisseur') return Promise.all([ensureCats(), ensureUnites(), ensureProvinces(), rest('fournisseurs?user_id=eq.' + uid() + '&select=*').then(function(x){ S.fourn = x && x[0] || null; })]);
  if (r === 'admin') return Promise.all([ensureCats(), ensureProvinces(), rest('admins?user_id=eq.' + uid() + '&select=niveau').then(function(x){ S.adminLevel = x && x[0] ? x[0].niveau : null; })]);
  return Promise.resolve();
}
function onTab(){
  var r = S.profile && S.profile.role, t = S.tab;
  if (r === 'client' && t === 'compte' && S.mesDemandes == null) rest('demandes_produits?select=*&order=created_at.desc').then(function(x){ S.mesDemandes = x || []; render(); }).catch(function(e){ toast(e.message, 'err'); });
  if (r === 'fournisseur' && t === 'produits' && S.fourn && S.mesProduits == null) loadMesProduits();
  if (r === 'admin' && t === 'fourn' && S.adm.fourn == null) loadAdmFourn();
  if (r === 'admin' && t === 'prod' && S.adm.prod == null) loadAdmProd();
  if (r === 'admin' && t === 'zones' && S.adm.zVilles == null) loadZones();
}
function loadMesProduits(){
  return rest(PSEL + '&fournisseur_id=eq.' + uid() + '&order=created_at.desc').then(function(x){ S.mesProduits = x || []; render(); }).catch(function(e){ S.mesProduits = []; render(); toast(e.message, 'err'); });
}
function loadAdmFourn(){
  return rest('fournisseurs?select=*,profiles(nom,postnom,prenom,telephone)&order=created_at.desc').then(function(x){ S.adm.fourn = x || []; render(); }).catch(function(e){ S.adm.fourn = []; render(); toast(e.message, 'err'); });
}
function loadAdmProd(){
  return rest('produits?select=*,unites(libelle),categories(nom),fournisseurs(nom_commerce),produit_medias(*)&order=created_at.desc&limit=200').then(function(x){ S.adm.prod = x || []; render(); }).catch(function(e){ S.adm.prod = []; render(); toast(e.message, 'err'); });
}
function loadZones(){
  var pid = S.adm.zProv;
  var p0 = pid ? Promise.resolve() : ensureProvinces().then(function(l){ var k = l.filter(function(x){ return x.nom === 'Kinshasa'; })[0] || l[0]; S.adm.zProv = k ? k.id : null; });
  return p0.then(function(){
    S.adm.zVilles = null; render();
    delete S.geo.villes[S.adm.zProv];
    return ensureVilles(S.adm.zProv);
  }).then(function(vs){
    S.adm.zVilles = vs;
    vs.forEach(function(v){ delete S.geo.communes[v.id]; });
    return Promise.all(vs.map(function(v){ return ensureCommunes(v.id); }));
  }).then(function(){ render(); }).catch(function(e){ S.adm.zVilles = []; render(); toast(e.message, 'err'); });
}

/* ---------- Actions ---------- */
function setBusy(b){ S.busy = b; render(); }
function readForm(){ return S.draft; }
var A = {
  go: function(el){ S.screen = el.dataset.v; S.error = ''; if (S.screen === 'signup'){ if (!S.draft.role) S.draft.role = 'client'; render(); geoDefaults('g_').then(render).catch(function(){}); return; } render(); },
  guest: function(){ S.screen = 'guest'; S.error = ''; S.cat = { items: null, q: '', catId: null, subId: null, token: S.cat.token || 0 }; render(); Promise.all([ensureCats()]).then(function(){ render(); return loadCatalogue(); }).catch(function(e){ toast(e.message, 'err'); }); },
  role: function(el){ S.draft.role = el.dataset.v; render(); },
  showpw: function(el){ var i = document.getElementById(el.dataset.v); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? 'Voir' : 'Masquer'; },
  tab: function(el){ S.tab = el.dataset.v; S.sheet = null; render(); window.scrollTo(0, 0); onTab(); },
  logout: function(){ signOut(); },
  cat: function(el){ S.cat.catId = el.dataset.v ? Number(el.dataset.v) : null; S.cat.subId = null; render(); loadCatalogue(); },
  sub: function(el){ var id = Number(el.dataset.v); S.cat.subId = S.cat.subId === id ? null : id; render(); loadCatalogue(); },
  detail: function(el){ S.sheet = 'detail'; S.sheetId = el.dataset.v; render(); },
  request: function(){ S.sheet = 'request'; S.draft.r_nom = S.cat.q; render(); },
  close: function(){ S.sheet = null; S.pf = null; render(); },
  ovclose: function(el, ev){ if (ev.target === el){ A.close(); } },
  newprod: function(){
    S.pf = { id: null, categorie_id: '', nom: '', description: '', origine: '', conservation: '', prix: '', devise: 'USD', unite_id: '', quantite_min: 1, stock: '', disponible: true, media: [], files: [], video: null, err: '' };
    S.sheet = 'product'; render();
  },
  editprod: function(el){
    var p = (S.mesProduits || []).filter(function(x){ return x.id === el.dataset.v; })[0]; if (!p) return;
    S.pf = { id: p.id, categorie_id: p.categorie_id || '', nom: p.nom, description: p.description || '', origine: p.origine || '', conservation: p.conservation || '', prix: p.prix, devise: p.devise, unite_id: p.unite_id, quantite_min: p.quantite_min, stock: p.stock == null ? '' : p.stock, disponible: p.disponible,
      media: (p.produit_medias || []).map(function(m){ return { id: m.id, type: m.type, chemin: m.chemin, statut: m.statut, del: false }; }), files: [], video: null, err: '', statut: p.statut };
    S.sheet = 'product'; render();
  },
  pfdelm: function(el){ (S.pf.media || []).forEach(function(m){ if (m.id === el.dataset.v) m.del = true; }); render(); },
  pfdelf: function(el){ S.pf.files.splice(Number(el.dataset.v), 1); render(); },
  pfdelv: function(){ S.pf.video = null; render(); },
  askdel: function(el){ S.confirm = 'del' + el.dataset.v; render(); },
  delprod: function(el){
    var p = (S.mesProduits || []).filter(function(x){ return x.id === el.dataset.v; })[0];
    S.confirm = null;
    remove('produits?id=eq.' + el.dataset.v).then(function(){
      var paths = (p && p.produit_medias || []).map(function(m){ return m.chemin; });
      if (paths.length) storageRemove('produits', paths).catch(function(){});
      S.mesProduits = S.mesProduits.filter(function(x){ return x.id !== el.dataset.v; }); render(); toast('Produit supprimé.');
    }).catch(function(e){ render(); toast(e.message, 'err'); });
  },
  hide: function(el){ setProdStatut(el.dataset.v, 'masque'); },
  unhide: function(el){ setProdStatut(el.dataset.v, 'publie'); },
  ffilter: function(el){ S.adm.fFilter = el.dataset.v; render(); },
  pfilter: function(el){ S.adm.pFilter = el.dataset.v; render(); },
  fstat: function(el){
    var a = el.dataset.v.split('|'), n = document.getElementById('note' + a[0]), note = n ? n.value.trim() : '';
    patch('fournisseurs?user_id=eq.' + a[0], { statut: a[1], note_admin: note || null }).then(function(r){
      S.adm.fourn = S.adm.fourn.map(function(f){ return f.user_id === a[0] ? Object.assign({}, f, r) : f; }); render(); toast('Fournisseur mis à jour.');
    }).catch(function(e){ toast(e.message, 'err'); });
  },
  pstat: function(el){
    var a = el.dataset.v.split('|'), m = document.getElementById('mot' + a[0]), motif = m ? m.value.trim() : '';
    if (a[1] === 'refuse' && !motif){ toast('Indiquez un motif de refus.', 'err'); return; }
    var body = { statut: a[1] }; if (a[1] === 'refuse') body.motif_refus = motif; else body.motif_refus = null;
    patch('produits?id=eq.' + a[0], body).then(function(r){
      S.adm.prod = S.adm.prod.map(function(p){ return p.id === a[0] ? Object.assign({}, p, r) : p; }); render(); toast('Produit mis à jour.');
    }).catch(function(e){ toast(e.message, 'err'); });
  },
  mstat: function(el){
    var a = el.dataset.v.split('|');
    patch('produit_medias?id=eq.' + a[0], { statut: a[1] }).then(function(r){
      S.adm.prod.forEach(function(p){ (p.produit_medias || []).forEach(function(m){ if (m.id === a[0]) m.statut = r.statut; }); }); render(); toast('Média mis à jour.');
    }).catch(function(e){ toast(e.message, 'err'); });
  },
  zsave: function(el){
    var a = el.dataset.v.split('|'), k = a[0], id = a[1], tbl = k === 'c' ? 'communes' : 'villes';
    var act = document.getElementById('za' + k + id).checked, u = Number(document.getElementById('zu' + k + id).value || 0), c = Number(document.getElementById('zc' + k + id).value || 0);
    if (u < 0 || c < 0 || isNaN(u) || isNaN(c)){ toast('Frais invalides.', 'err'); return; }
    patch(tbl + '?id=eq.' + id, { livraison_active: act, frais_usd: u, frais_cdf: c }).then(function(r){
      if (k === 'c') Object.keys(S.geo.communes).forEach(function(v){ S.geo.communes[v] = S.geo.communes[v].map(function(x){ return x.id === r.id ? r : x; }); });
      else S.adm.zVilles = S.adm.zVilles.map(function(x){ return x.id === r.id ? r : x; });
      render(); toast(act ? 'Livraison activée.' : 'Livraison désactivée.');
    }).catch(function(e){ toast(e.message, 'err'); });
  }
};
function setProdStatut(id, st){
  patch('produits?id=eq.' + id, { statut: st }).then(function(r){
    S.mesProduits = S.mesProduits.map(function(p){ return p.id === id ? Object.assign({}, p, { statut: r.statut }) : p; }); render(); toast(st === 'masque' ? 'Produit masqué.' : 'Produit republié.');
  }).catch(function(e){ toast(e.message, 'err'); });
}

/* ---------- Formulaires ---------- */
function need(v){ return v != null && String(v).trim() !== ''; }
var F = {
  login: function(){
    var d = S.draft, ph = normPhone(d.phone);
    if (!ph) return fail('Entrez un numéro valide, par exemple 0812345678.');
    if (!need(d.pw)) return fail('Entrez votre mot de passe.');
    S.error = ''; setBusy(true);
    authFetch('token?grant_type=password', { email: ph + '@' + EMAIL_DOMAIN, password: d.pw }).then(function(r){
      setSession(r); S.busy = false; S.draft = {}; S.screen = 'welcome'; boot();
    }).catch(function(e){ S.busy = false; S.error = e.message; render(); });
  },
  signup: function(){
    var d = S.draft, role = d.role || 'client', ph = normPhone(d.phone);
    if (!need(d.nom) || !need(d.prenom)) return fail('Entrez votre nom et votre prénom.');
    if (!ph) return fail('Entrez un numéro valide, par exemple 0812345678.');
    if (!d.pw || d.pw.length < 6) return fail('Le mot de passe doit avoir au moins 6 caractères.');
    if (role === 'fournisseur'){ if (!need(d.commerce)) return fail('Entrez le nom de votre commerce.'); }
    else { if (!d.g_prov || !d.g_ville) return fail('Choisissez votre province et votre ville.'); if ((S.geo.communes[d.g_ville] || []).length && !d.g_commune) return fail('Choisissez votre commune.'); if (!need(d.adresse)) return fail('Entrez votre adresse de livraison.'); }
    if (!d.consent) return fail('Cochez la case d\'acceptation pour continuer.');
    S.error = ''; setBusy(true);
    var after = null;
    authFetch('signup', { email: ph + '@' + EMAIL_DOMAIN, password: d.pw, data: { nom: d.nom.trim(), postnom: (d.postnom || '').trim(), prenom: d.prenom.trim(), telephone: ph, role: role } }).then(function(r){
      if (!r || !r.access_token) throw new ApiError('La confirmation par e-mail est encore activée dans Supabase. Il faut la désactiver (Authentication, Sign In / Providers, Email).');
      setSession(r);
      var p;
      if (role === 'fournisseur') p = insert('fournisseurs', { user_id: r.user.id, nom_commerce: d.commerce.trim(), description: (d.descr || '').trim() || null, telephone: ph, province_id: d.g_prov ? Number(d.g_prov) : null, ville_id: d.g_ville ? Number(d.g_ville) : null, adresse: (d.adresse || '').trim() || null });
      else p = insert('adresses', { client_id: r.user.id, libelle: 'Domicile', province_id: Number(d.g_prov), ville_id: Number(d.g_ville), commune_id: d.g_commune ? Number(d.g_commune) : null, quartier: (d.quartier || '').trim() || null, avenue: d.adresse.trim(), telephone: ph, par_defaut: true });
      return p.catch(function(e){ after = 'Compte créé, mais ' + (role === 'fournisseur' ? 'les informations de la boutique' : 'l\'adresse') + ' n\'ont pas été enregistrées (' + e.message + '). Vous pourrez les compléter.'; });
    }).then(function(){
      S.busy = false; S.draft = {}; S.screen = 'welcome'; return boot().then(function(){ toast(after || 'Bienvenue sur BISO MARKET !', after ? 'err' : ''); });
    }).catch(function(e){ S.busy = false; S.error = e.message; render(); if (S.session && !S.profile) { S.session = null; store.del('biso.session'); } });
  },
  fsetup: function(){
    var d = S.draft;
    if (!need(d.commerce)) return fail('Entrez le nom de votre commerce.');
    setBusy(true);
    insert('fournisseurs', { user_id: uid(), nom_commerce: d.commerce.trim(), description: (d.descr || '').trim() || null, telephone: S.profile.telephone, province_id: d.g_prov ? Number(d.g_prov) : null, ville_id: d.g_ville ? Number(d.g_ville) : null, adresse: (d.adresse || '').trim() || null }).then(function(r){
      S.fourn = r; S.busy = false; S.draft = {}; render(); onTab(); toast('Boutique envoyée pour vérification.');
    }).catch(function(e){ S.busy = false; render(); toast(e.message, 'err'); });
  },
  request: function(){
    var d = S.draft;
    if (!need(d.r_nom)) { toast('Indiquez le produit recherché.', 'err'); return; }
    setBusy(true);
    insert('demandes_produits', { client_id: uid(), nom_produit: d.r_nom.trim(), quantite_souhaitee: (d.r_qte || '').trim() || null, description: (d.r_desc || '').trim() || null }).then(function(){
      S.busy = false; S.sheet = null; S.mesDemandes = null; d.r_nom = d.r_qte = d.r_desc = ''; render(); toast('Demande envoyée. Merci !');
    }).catch(function(e){ S.busy = false; render(); toast(e.message, 'err'); });
  },
  addville: function(){
    var d = S.draft;
    if (!need(d.v_nom)) { toast('Entrez le nom.', 'err'); return; }
    insert('villes', { province_id: S.adm.zProv, nom: d.v_nom.trim(), type: d.v_type || 'ville' }).then(function(){ d.v_nom = ''; delete S.geo.villes[S.adm.zProv]; loadZones(); toast('Ajouté.'); }).catch(function(e){ toast(e.message, 'err'); });
  },
  product: function(){ saveProduct(); }
};
function fail(m){ S.error = m; render(); window.scrollTo(0, 0); }

function saveProduct(){
  var f = S.pf;
  function bad(m){ f.err = m; render(); var s = document.querySelector('.sheet'); if (s) s.scrollTop = s.scrollHeight; }
  if (!need(f.nom)) return bad('Entrez le nom du produit.');
  if (!f.categorie_id) return bad('Choisissez une catégorie.');
  if (!f.unite_id) return bad('Choisissez l\'unité de vente.');
  var prix = Number(f.prix); if (!(prix > 0)) return bad('Entrez un prix supérieur à zéro.');
  var qmin = Number(f.quantite_min); if (!(qmin > 0)) return bad('La quantité minimale doit être supérieure à zéro.');
  var stock = f.stock === '' || f.stock == null ? null : Number(f.stock); if (stock !== null && !(stock >= 0)) return bad('Stock invalide.');
  var remaining = (f.media || []).filter(function(m){ return !m.del && m.type === 'photo'; }).length + f.files.length;
  if (remaining < 1) return bad('Ajoutez au moins une photo réelle du produit.');
  f.err = ''; f.saving = true; f.step = 'Enregistrement…'; render();
  var id = f.id || uuid(), body = { categorie_id: Number(f.categorie_id), nom: f.nom.trim(), description: (f.description || '').trim() || null, origine: (f.origine || '').trim() || null, conservation: (f.conservation || '').trim() || null, prix: prix, devise: f.devise, unite_id: Number(f.unite_id), quantite_min: qmin, stock: stock, disponible: !!f.disponible };
  var warnings = [], first = f.id ? patch('produits?id=eq.' + id, body) : insert('produits', Object.assign({ id: id, fournisseur_id: uid() }, body));
  first.then(function(){
    var dels = (f.media || []).filter(function(m){ return m.del; });
    return Promise.all(dels.map(function(m){ return remove('produit_medias?id=eq.' + m.id).then(function(){ return storageRemove('produits', [m.chemin]).catch(function(){}); }).catch(function(e){ warnings.push(e.message); }); }));
  }).then(function(){
    var order = (f.media || []).length, seq = Promise.resolve();
    f.files.forEach(function(file, i){
      seq = seq.then(function(){
        f.step = 'Photo ' + (i + 1) + '/' + f.files.length + '…'; render();
        return compressImage(file, 1280).then(function(blob){
          var path = uid() + '/' + id + '/' + Date.now() + '-' + i + '.jpg';
          return storageUpload('produits', path, blob, 'image/jpeg').then(function(){ return insert('produit_medias', { produit_id: id, type: 'photo', chemin: path, ordre: order + i }); });
        }).catch(function(e){ warnings.push('Photo ' + (i + 1) + ' : ' + e.message); });
      });
    });
    if (f.video){
      seq = seq.then(function(){
        f.step = 'Vidéo…'; render();
        var path = uid() + '/' + id + '/' + Date.now() + '-v.' + extOf(f.video.type);
        return storageUpload('produits', path, f.video, f.video.type).then(function(){ return insert('produit_medias', { produit_id: id, type: 'video', chemin: path, ordre: 99 }); }).catch(function(e){ warnings.push('Vidéo : ' + e.message); });
      });
    }
    return seq;
  }).then(function(){
    S.sheet = null; S.pf = null; S.mesProduits = null; render(); loadMesProduits();
    toast(warnings.length ? 'Produit enregistré, mais : ' + warnings.join(' ') : (f.id ? 'Produit mis à jour.' : 'Produit envoyé pour validation.'), warnings.length ? 'err' : '');
  }).catch(function(e){ f.saving = false; f.err = e.message; render(); });
}

/* ---------- Événements ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var a = el.dataset.act;
  if (a === 'ovclose' && ev.target !== el) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (A[a]) A[a](el, ev);
});
document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.dataset.k){ S.draft[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; }
  else if (el.dataset.pf && S.pf){ S.pf[el.dataset.pf] = el.type === 'checkbox' ? el.checked : el.value; }
  else if (el.id === 'q'){ S.cat.q = el.value; clearTimeout(S.qt); S.qt = setTimeout(loadCatalogue, 350); }
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.dataset.k){ S.draft[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; }
  if (el.dataset.pf && S.pf){ S.pf[el.dataset.pf] = el.type === 'checkbox' ? el.checked : el.value; }
  if (el.dataset.geo){
    var g = el.dataset.geo.split('|'), p = g[0], lvl = g[1], d = S.draft;
    if (lvl === 'prov'){ d[p + 'ville'] = ''; d[p + 'commune'] = ''; ensureVilles(el.value).then(function(v){ if (v.length === 1){ d[p + 'ville'] = String(v[0].id); return ensureCommunes(v[0].id); } }).then(render).catch(function(e){ toast(e.message, 'err'); }); }
    else { d[p + 'commune'] = ''; ensureCommunes(el.value).then(render).catch(function(e){ toast(e.message, 'err'); }); }
    render();
  }
  if (el.dataset.actChange === 'zprov'){ S.adm.zProv = Number(el.value); loadZones(); }
  if (el.dataset.files && S.pf){
    var files = Array.prototype.slice.call(el.files || []);
    if (el.dataset.files === 'photo'){
      var ok = files.filter(function(x){ return /^image\//.test(x.type); });
      if (ok.length !== files.length) toast('Seules les images sont acceptées pour les photos.', 'err');
      S.pf.files = S.pf.files.concat(ok).slice(0, 6); render();
    } else if (files[0]){
      checkVideo(files[0]).then(function(v){ S.pf.video = v; render(); }).catch(function(e){ S.pf.video = null; render(); toast(e.message, 'err'); });
    }
  }
});
document.addEventListener('submit', function(ev){
  var f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  if (F[f.dataset.form]) F[f.dataset.form](f);
});
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && S.sheet) A.close(); });

boot();
</script>
</body>
